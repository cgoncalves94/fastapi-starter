# Workflow name
name: "Run Tests"

# Trigger the workflow on pull requests and pushes to the "main" branch
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

# Define the jobs for the workflow
jobs:
  # Job name
  test:
    # Readable name for the job
    name: Run Tests (Python ${{ matrix.python-version }})
    # Runner environment for the job
    runs-on: ubuntu-latest

    # Test matrix to run tests on multiple Python versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    # Service containers for PostgreSQL
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_starter_test
        ports:
          - 5432:5432
        # Health checks to ensure postgres is ready before running tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Steps to be executed in the job
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Generate a random secret key for tests
      - name: Generate test secret key
        id: generate-secret
        run: |
          # Generate a random secret key for CI tests only
          # This is NOT a production secret, it's generated fresh for each test run
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT

      # Run tests with pytest
      - name: Run tests with pytest
        env:
          # Database connection for tests
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_starter_test
          # App configuration (using generated secret from previous step)
          SECRET_KEY: ${{ steps.generate-secret.outputs.SECRET_KEY }}
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      # Upload coverage to artifacts (optional)
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

      # Display coverage summary
      - name: Coverage Summary
        if: always()
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
